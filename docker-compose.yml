services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent-db-init:
    image: mysql:8.4
    depends_on:
      mysql: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mysql -hmysql -uroot -proot -e
        "CREATE DATABASE IF NOT EXISTS agent_management;
        GRANT ALL PRIVILEGES ON agent_management.* TO 'nexus'@'%';
        FLUSH PRIVILEGES;"
    command: []
    restart: "no"
  backend:
    build: .
    environment:
      NEXUS_JWT_SECRET: change-this-development-secret-to-a-32-byte-minimum
      NEXUS_DATABASE_URL: jdbc:mysql://mysql:3306/nexus
      NEXUS_DATABASE_USERNAME: nexus
      NEXUS_DATABASE_PASSWORD: nexus
      NEXUS_REDIS_URL: redis://redis:6379
    ports: ["8081:8080"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081/api/v1
    ports: ["5174:80"]
    depends_on: [backend]
  agent-management:
    build:
      context: .
      dockerfile: agent-management/Dockerfile
    environment:
      NEXUS_API_BASE_URL: http://backend:8080/api/v1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AGENT_DATABASE_URL: jdbc:mysql://mysql:3306/agent_management
      AGENT_DATABASE_USERNAME: nexus
      AGENT_DATABASE_PASSWORD: nexus
      AGENT_CREDENTIAL_ENCRYPTION_KEY: ${AGENT_CREDENTIAL_ENCRYPTION_KEY:-iu+IglUprmYQc9VrpY5+Twe0MIVaBSx3pWFlgkEOsRM=}
      AGENT_DEFAULT_PASSWORD: ${AGENT_DEFAULT_PASSWORD:-agent}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      NEXUS_ADMIN_USERNAME: ${NEXUS_ADMIN_USERNAME:-admin}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-admin-password}
      AGENT_BOOTSTRAP_ENABLED: ${AGENT_BOOTSTRAP_ENABLED:-true}
      AGENT_BOOTSTRAP_COUNT: ${AGENT_BOOTSTRAP_COUNT:-10}
      AGENT_RECENT_CHAT_LIMIT: ${AGENT_RECENT_CHAT_LIMIT:-5}
    depends_on:
      agent-db-init: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      backend: { condition: service_healthy }
volumes:
  mysql-data:
  redis-data: