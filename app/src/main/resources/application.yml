server:
  port: 8080
spring:
  application:
    name: nexus
  datasource:
    url: ${NEXUS_DATABASE_URL:jdbc:mysql://localhost:3307/nexus}
    username: ${NEXUS_DATABASE_USERNAME:nexus}
    password: ${NEXUS_DATABASE_PASSWORD:nexus}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
  data:
    redis:
      url: ${NEXUS_REDIS_URL:redis://localhost:6379}
management:
  endpoints:
    web:
      exposure:
        include: health
nexus:
  admin:
    username: ${NEXUS_ADMIN_USERNAME:admin}
    password: ${NEXUS_ADMIN_PASSWORD:admin-password}
    display-name: ${NEXUS_ADMIN_DISPLAY_NAME:Nexus Administrator}